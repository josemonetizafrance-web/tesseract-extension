<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TESSERACT - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(15,15,25,0.95);
            border-bottom: 1px solid #8b5cf6;
        }
        .top-bar-left { display: flex; gap: 10px; }
        .top-bar-right { display: flex; align-items: center; }
        .layout {
            display: flex;
            min-height: calc(100vh - 53px);
        }
        .sidebar {
            width: 200px;
            background: rgba(12,12,22,0.95);
            border-right: 1px solid rgba(139,92,246,0.15);
            padding: 16px 0;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: #8888a0;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        .nav-item:hover { color: #c4b5fd; background: rgba(139,92,246,0.06); }
        .nav-item.active { color: #8b5cf6; border-left-color: #8b5cf6; background: rgba(139,92,246,0.1); }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .view { display: none; width: 100%; max-width: 650px; }
        .view.active { display: block; }

        .dash-container {
            width: 100%;
            padding: 40px;
            background: linear-gradient(145deg, rgba(20,18,40,0.95), rgba(10,10,20,0.98));
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 16px;
            text-align: center;
            position: relative;
            transform: perspective(1000px) rotateX(2deg);
            box-shadow:
                0 0 30px rgba(139,92,246,0.15),
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(139,92,246,0.2),
                inset 0 -1px 0 rgba(139,92,246,0.1);
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .dash-container::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 17px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(139,92,246,0.5), transparent 40%, transparent 60%, rgba(139,92,246,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .dash-container:hover {
            transform: perspective(1000px) rotateX(0deg);
            box-shadow:
                0 0 50px rgba(139,92,246,0.25),
                0 25px 80px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(139,92,246,0.3),
                inset 0 -1px 0 rgba(139,92,246,0.15);
        }
        .logo { width: 80px; height: 80px; margin: 0 auto 20px; }
        .logo svg { width: 100%; height: 100%; }
        h1 { font-size: 28px; color: #8b5cf6; letter-spacing: 4px; margin-bottom: 8px; }
        .subtitle { font-size: 11px; color: #8888a0; letter-spacing: 2px; margin-bottom: 30px; }
        .info { font-size: 12px; color: #8888a0; margin-bottom: 20px; }
        .status-badge {
            display: inline-block; padding: 4px 12px;
            border-radius: 2px; font-size: 11px; font-weight: 600;
            margin-bottom: 20px;
        }
        .status-demo { background: rgba(234,179,8,0.2); color: #fde047; }
        .status-premium { background: rgba(139,92,246,0.2); color: #c4b5fd; }
        .status-expired { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .status-developer { background: rgba(34,197,94,0.2); color: #4ade80; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 2px;
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            font-weight: 600; letter-spacing: 1px; cursor: pointer;
        }
        .btn-primary { background: #8b5cf6; color: #fff; }
        .btn-primary:hover { background: #7c3aed; }
        .btn-secondary { background: #333350; color: #e0e0e0; }
        .btn-secondary:hover { background: #444470; }
        .btn-danger { background: transparent; color: #ef4444; border: 1px solid #ef4444; }
        .btn-danger:hover { background: #ef4444; color: #fff; }
        .time-remaining { font-size: 14px; color: #8b5cf6; margin-bottom: 20px; }
        .footer { margin-top: 30px; font-size: 9px; color: #555570; }

        /* Notes view */
        .notes-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .notes-header h2 { color: #8b5cf6; font-size: 18px; letter-spacing: 2px; }
        .notes-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid rgba(139,92,246,0.2); }
        .notes-tab { padding: 8px 20px; background: transparent; border: none; color: #8888a0; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; cursor: pointer; letter-spacing: 1px; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .notes-tab:hover { color: #c4b5fd; }
        .notes-tab.active { color: #8b5cf6; border-bottom-color: #8b5cf6; }
        .notes-tab-content { display: none; }
        .notes-tab-content.active { display: block; }
        .note-form { background: rgba(10,10,20,0.6); border: 1px solid rgba(139,92,246,0.15); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .note-form input, .note-form textarea { width: 100%; padding: 10px; margin-bottom: 8px; background: rgba(0,0,0,0.4); border: 1px solid rgba(139,92,246,0.2); border-radius: 6px; color: #e0e0e0; font-family: 'JetBrains Mono', monospace; font-size: 11px; outline: none; transition: border-color 0.2s; }
        .note-form input:focus, .note-form textarea:focus { border-color: #8b5cf6; }
        .note-form textarea { min-height: 80px; resize: vertical; }
        .note-form .form-row { display: flex; gap: 8px; }
        .note-form .form-row input { flex: 1; }
        .btn-notes { padding: 8px 20px; background: #8b5cf6; color: #fff; border: none; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; cursor: pointer; letter-spacing: 1px; transition: background 0.2s; }
        .btn-notes:hover { background: #7c3aed; }
        .btn-notes-sm { padding: 4px 12px; font-size: 10px; border-radius: 4px; }
        .btn-notes-outline { background: transparent; border: 1px solid rgba(139,92,246,0.3); color: #c4b5fd; }
        .btn-notes-outline:hover { background: rgba(139,92,246,0.15); }
        .btn-notes-danger { background: transparent; border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .btn-notes-danger:hover { background: rgba(239,68,68,0.15); }
        .btn-notes-success { background: transparent; border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
        .btn-notes-success:hover { background: rgba(34,197,94,0.15); }
        .note-card { background: rgba(10,10,20,0.6); border: 1px solid rgba(139,92,246,0.12); border-radius: 10px; padding: 14px; margin-bottom: 10px; transition: border-color 0.2s; }
        .note-card:hover { border-color: rgba(139,92,246,0.3); }
        .note-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .note-card-title { font-size: 12px; color: #c4b5fd; font-weight: 600; }
        .note-card-sub { font-size: 10px; color: #666680; }
        .note-card-text { font-size: 11px; color: #ccc; line-height: 1.5; margin-top: 6px; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 6px; white-space: pre-wrap; }
        .note-card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .note-card-meta { font-size: 9px; color: #555570; margin-top: 6px; }
        .note-shared-badge { font-size: 9px; color: #4ade80; background: rgba(34,197,94,0.1); padding: 2px 8px; border-radius: 4px; display: inline-block; }
        .note-empty { text-align: center; padding: 30px; color: #555570; font-size: 11px; }

        .share-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .share-modal-content { background: #1a1a2e; padding: 24px; border-radius: 12px; max-width: 400px; width: 90%; border: 1px solid rgba(139,92,246,0.3); }
        .share-modal-content h3 { color: #8b5cf6; margin-bottom: 12px; font-size: 14px; letter-spacing: 1px; }
        .share-modal-content select { width: 100%; padding: 10px; margin-bottom: 12px; background: #0a0a0f; border: 1px solid rgba(139,92,246,0.2); border-radius: 6px; color: #e0e0e0; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .share-modal-content select option { background: #0a0a0f; }
        .edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .edit-modal-content { background: #1a1a2e; padding: 24px; border-radius: 12px; max-width: 500px; width: 90%; border: 1px solid rgba(139,92,246,0.3); }
        .edit-modal-content h3 { color: #8b5cf6; margin-bottom: 12px; font-size: 14px; letter-spacing: 1px; }
        .edit-modal-content input, .edit-modal-content textarea { width: 100%; padding: 10px; margin-bottom: 8px; background: #0a0a0f; border: 1px solid rgba(139,92,246,0.2); border-radius: 6px; color: #e0e0e0; font-family: 'JetBrains Mono', monospace; font-size: 11px; outline: none; }
        .edit-modal-content textarea { min-height: 80px; resize: vertical; }
        .edit-modal-content .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

        .notification { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; font-size: 11px; font-family: 'JetBrains Mono', monospace; z-index: 9999; opacity: 0; transform: translateY(-20px); transition: all 0.3s; }
        .notification.show { opacity: 1; transform: translateY(0); }
        .notification-success { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .notification-error { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

        @media (max-width: 700px) {
            .sidebar { width: 56px; }
            .sidebar .nav-item span { display: none; }
            .sidebar .nav-item { justify-content: center; padding: 12px; }
            .note-form .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <button class="btn btn-primary" id="btn-open-bot">ABRIR BOT PANEL</button>
            <button class="btn btn-secondary" id="btn-admin" style="display:none;">ADMIN PANEL</button>
        </div>
        <div class="top-bar-right">
            <button class="btn btn-danger" id="btn-logout">CERRAR SESIÓN</button>
        </div>
    </div>
    <div class="layout">
        <div class="sidebar">
            <div class="nav-item active" data-view="dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                <span>DASHBOARD</span>
            </div>
            <div class="nav-item" data-view="notes">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                <span>NOTAS</span>
            </div>
        </div>
        <div class="main-content">
            <!-- View: Dashboard -->
            <div class="view active" id="view-dashboard">
                <div class="dash-container">
                    <div class="logo">
                        <svg viewBox="0 0 64 64" fill="none">
                            <rect x="8" y="8" width="48" height="48" rx="4" stroke="#8b5cf6" stroke-width="2"/>
                            <path d="M20 32L28 40L44 24" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1>TESSERACT</h1>
                    <p class="subtitle">DASHBOARD</p>
                    <div class="info" id="user-info">Cargando...</div>
                    <div class="status-badge" id="status-badge">--</div>
                    <div class="time-remaining" id="time-remaining"></div>
                    <div class="footer">v22.90 &mdash; 2026 TESSERACT</div>
                </div>
            </div>

            <!-- View: Notes -->
            <div class="view" id="view-notes">
                <div class="notes-header">
                    <h2>NOTAS</h2>
                    <button class="btn-notes" id="btn-back-dash">VOLVER AL DASHBOARD</button>
                </div>
                <div class="notes-tabs">
                    <button class="notes-tab active" data-tab="my-notes">MIS NOTAS</button>
                    <button class="notes-tab" data-tab="shared-notes">COMPARTIDAS</button>
                </div>
                <div class="notes-tab-content active" id="tab-my-notes">
                    <div class="note-form">
                        <div class="form-row">
                            <input type="text" id="note-profile-name" placeholder="Perfil">
                            <input type="text" id="note-client-name" placeholder="Nombre del cliente">
                            <input type="text" id="note-client-id" placeholder="ID del cliente">
                        </div>
                        <textarea id="note-text" placeholder="Escribe tu nota aqui..."></textarea>
                        <button class="btn-notes" id="btn-save-note">GUARDAR NOTA</button>
                    </div>
                    <div id="my-notes-list"></div>
                </div>
                <div class="notes-tab-content" id="tab-shared-notes">
                    <div id="shared-notes-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="share-modal" id="share-modal">
        <div class="share-modal-content">
            <h3>COMPARTIR NOTA</h3>
            <p style="font-size:11px;color:#888;margin-bottom:12px;">Ingresa el email del usuario para compartir esta nota:</p>
            <input type="email" id="share-user-email" placeholder="email@tesseract.com" style="width:100%;padding:10px;margin-bottom:12px;background:#0a0a0f;border:1px solid rgba(139,92,246,0.2);border-radius:6px;color:#e0e0e0;font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;">
            <div class="modal-buttons">
                <button class="btn-notes btn-notes-outline btn-notes-sm" id="btn-cancel-share">CANCELAR</button>
                <button class="btn-notes btn-notes-sm" id="btn-confirm-share">COMPARTIR</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="edit-modal" id="edit-modal">
        <div class="edit-modal-content">
            <h3>EDITAR NOTA</h3>
            <input type="text" id="edit-profile-name" placeholder="Perfil">
            <input type="text" id="edit-client-name" placeholder="Nombre del cliente">
            <input type="text" id="edit-client-id" placeholder="ID del cliente">
            <textarea id="edit-note-text" placeholder="Escribe tu nota aqui..."></textarea>
            <div class="modal-buttons">
                <button class="btn-notes btn-notes-outline btn-notes-sm" id="btn-cancel-edit">CANCELAR</button>
                <button class="btn-notes btn-notes-sm" id="btn-confirm-edit">GUARDAR</button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script src="dashboard.js"></script>
</body>
</html>
